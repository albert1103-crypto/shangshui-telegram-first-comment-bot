name: Deploy temporary Cloudflare preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-temporary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy and encrypt private result
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4.112.0 deploy --temporary > "$RUNNER_TEMP/deploy.log" 2>&1
          deploy_status=$?
          printf '%s\n' "$deploy_status" > "$RUNNER_TEMP/status.txt"

          cat > "$RUNNER_TEMP/public.pem" <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA6XIzwiaBh3YczU3XONzZ
          m3dL8QoqCNemy8CuogZHP42qOD282mVLNuYt5F7oA6HRHZVElDxGE8TY2DpSWECG
          /5cbXBBmzYXRzpyXQMe0cbiURJv0SVPwj+tc9wwnylHqvJtG7WBdIckz2xirdkdL
          S4iF+OfcHpsDXML+g70XrGjobn5UDcbPNJm3bSpJRWOSvnTCsVeIrFeiJFhkilan
          g2ih8YMPxD+kwWyxM6xfhnrdl/5njTajCF6O1Jhp1Y1mTg+WnQ3qTy9ITS/IXRd7
          usk21RR1leY3XmWXvEs8y/9Zt3vPJqnnYkMqBWbdOAqo3cKB8psvJiPrCm9Ham+W
          zXsboIRBcSr9U1hQjUszi/k9CX9UJ5Ss+7Ug/7CDMojnEuKCJj2B1FniK9Z5K3ek
          uJ95nzMG0io4wGsuKd1OFJGvVNVjk1jpCKK4WNPkrGW2uObVZQY4NZopjTiBDwte
          alErXiuLjgEgY4PPx9GNzA697Dq3hjrWz+zWy5AaMFkbAgMBAAE=
          -----END PUBLIC KEY-----
          PUBLIC_KEY

          openssl rand -hex 32 > "$RUNNER_TEMP/key.hex"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/deploy.log" \
            -out "$RUNNER_TEMP/deploy.log.enc" \
            -pass file:"$RUNNER_TEMP/key.hex"
          openssl pkeyutl -encrypt -pubin \
            -inkey "$RUNNER_TEMP/public.pem" \
            -in "$RUNNER_TEMP/key.hex" \
            -out "$RUNNER_TEMP/key.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          rm -f "$RUNNER_TEMP/deploy.log" "$RUNNER_TEMP/key.hex" "$RUNNER_TEMP/public.pem"
          exit 0

      - name: Upload encrypted deployment result
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-temporary-deployment
          path: |
            ${{ runner.temp }}/deploy.log.enc
            ${{ runner.temp }}/key.enc
            ${{ runner.temp }}/status.txt
          retention-days: 1
          if-no-files-found: error
